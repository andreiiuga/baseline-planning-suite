# Rendered by the nginx image (envsubst) at container start. ${ALLOWED_ORIGIN} is the shell origin.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The federation manifest must always be revalidated so independent deploys are picked up.
  location = /remoteEntry.js {
    add_header Access-Control-Allow-Origin "${ALLOWED_ORIGIN}" always;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed build output is safe to cache for a long time.
  location /assets/ {
    add_header Access-Control-Allow-Origin "${ALLOWED_ORIGIN}" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    add_header Access-Control-Allow-Origin "${ALLOWED_ORIGIN}" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
