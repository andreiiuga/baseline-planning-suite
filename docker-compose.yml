services:
  shell:
    build: { context: ., dockerfile: docker/Dockerfile, target: shell }
    ports: ['${SHELL_PORT:-8080}:80']
    environment:
      PEOPLE_REMOTE_URL: ${PEOPLE_REMOTE_URL:-http://localhost:8081/remoteEntry.js}
      DELIVERY_REMOTE_URL: ${DELIVERY_REMOTE_URL:-http://localhost:8082/remoteEntry.js}

  people:
    build: { context: ., dockerfile: docker/Dockerfile, target: people }
    ports: ['${PEOPLE_PORT:-8081}:80']
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}

  delivery:
    build: { context: ., dockerfile: docker/Dockerfile, target: delivery }
    ports: ['${DELIVERY_PORT:-8082}:80']
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
