name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Date arithmetic must not depend on the host time zone: run the suite under two zones
      # (a fixed property-test seed applies because CI is set).
      - run: pnpm test:tz
      - run: pnpm test:contracts
      - run: pnpm -r build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up --build -d
      - run: npx --yes wait-on http://localhost:8080/config.json http://localhost:8081/remoteEntry.js http://localhost:8082/remoteEntry.js
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs --no-color
